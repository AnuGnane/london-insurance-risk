name: CI

# The holiday gate (HOLIDAY.md) on every pull request: the data-free pytest
# subset + ruff for the Python pipeline, lint + unit tests + Pages build (with
# the og:image share card, required as in the deploy) for the frontend.
# data/ and reports/ are git-ignored, so data-dependent tests skip here.

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The same share-card build as deploy-pages.yml, so a pull request proves
      # Chromium installs on this runner and og.png is produced before a merge.
      - name: Install Chromium for the og:image
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: '1'
          OG_IMAGE_REQUIRED: '1'
      - name: Check the og:image was built
        run: |
          test -s dist/og.png || { echo "::error file=frontend/scripts/og-image.mjs::dist/og.png is missing or empty"; exit 1; }
          ls -l dist/og.png
