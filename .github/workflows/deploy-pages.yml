name: Deploy showcase to GitHub Pages

# Builds the static frontend (which reads pre-baked data/areas.geojson +
# methodology.json committed under frontend/public/data) and publishes it to
# GitHub Pages. The Python backend is NOT deployed — the site is fully static
# (see docs/superpowers/info/SHOWCASE_PLAN.md). Regenerate the baked data with `make showcase-data`.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/PROJECT_SUMMARY.html'   # published as methodology.html by the build
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest is Ubuntu 26.04 since GitHub's Oct-Nov 2026 migration;
    # Playwright supports it from 1.61 (frontend/package.json pins the version).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Chromium for the build-time share card (scripts/og-image.mjs). The site is
      # not published without the card: if Chromium cannot install or og.png is
      # missing or empty, the build fails and the previous site stays up.
      - name: Install Chromium for the og:image
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: '1'
          OG_IMAGE_REQUIRED: '1'
      - name: Check the og:image was built
        run: |
          test -s dist/og.png || { echo "::error file=frontend/scripts/og-image.mjs::dist/og.png is missing or empty; not publishing without the share image"; exit 1; }
          ls -l dist/og.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
